name: Frontend checks

on: [pull_request, push]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: workshop
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: workshop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workshop -d workshop"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://workshop:ci-test-password@localhost:5432/workshop
      FRONTEND_ORIGIN: http://localhost:3011
      SEED_PASSWORD: ci-demo-password
      E2E_API_MODE: workshop
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            backend/facilities/requirements.txt
      - run: python -m pip install -r ../backend/requirements-dev.txt
      - run: npm ci
      - name: Verify generated contracts match the backend
        run: |
          npm run generate:api
          git diff --exit-code -- src/generated
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - name: Run admin and employee browser journeys against disposable PostgreSQL
        run: |
          python ../backend/scripts/create_tables.py
          python ../backend/scripts/seed_database.py
          cd ..
          python backend/tests/support/lambda_server.py --port 8000 > "$RUNNER_TEMP/backend.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8000/health > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:8000/health
          cd frontend
          npm run test:e2e
