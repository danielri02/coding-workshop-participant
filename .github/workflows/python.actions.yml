name: Backend checks

on: [pull_request, push]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: workshop
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: workshop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workshop -d workshop"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+psycopg://workshop:ci-test-password@localhost:5432/workshop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt ruff==0.17.1 bandit==1.9.4
      - name: Check active application style
        # Existing UTC/import-order debt is excluded until separately cleaned up.
        run: ruff check --ignore UP017,RUF022 backend/app backend/scripts backend/tests
      - run: bandit -q -r backend
      - name: Run unit and PostgreSQL integration tests
        run: python -m unittest discover -s backend/tests
